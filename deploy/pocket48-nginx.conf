server {
    listen 80;
    listen [::]:80;
    server_name pocket48.jiufeng.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pocket48.jiufeng.cloud;

    ssl_certificate /etc/letsencrypt/live/pocket48.jiufeng.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocket48.jiufeng.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:Pocket48TLS:10m;
    ssl_session_timeout 1d;

    access_log /www/wwwlogs/pocket48.jiufeng.cloud.log;
    error_log /www/wwwlogs/pocket48.jiufeng.cloud.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
